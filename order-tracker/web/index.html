<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>订单跟踪</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">发货清单</p>
      <h1>未到货订单跟踪</h1>
      <p class="lead">指定工作表、运单号列和运输公司列。先走免费 API；没有接口、被拦或出现人机验证时，再用 AI 查。结果汇总在本页，并写回状态列。</p>
    </header>

    <section class="card">
      <label for="url">在线表格地址</label>
      <div class="row">
        <input id="url" type="url" placeholder="https://www.kdocs.cn/l/xxxxxx" value="https://www.kdocs.cn/l/ccWzub8j0jIm" />
        <button id="loadBtn" type="button">读取表格</button>
        <button id="demoBtn" type="button" class="ghost">加载示例表</button>
      </div>
      <div class="row minor">
        <label class="file">或上传 xlsx <input id="file" type="file" accept=".xlsx,.xlsm" /></label>
      </div>
    </section>

    <section class="card hidden" id="mapCard">
      <h2>列映射（按你的表格固定列）</h2>
      <div class="grid3">
        <label>工作表
          <select id="sheetName"></select>
        </label>
        <label>运单号列
          <select id="trackingCol"></select>
        </label>
        <label>运输公司列
          <select id="carrierCol"></select>
        </label>
        <label>状态列（写回）
          <select id="statusCol"></select>
        </label>
      </div>
      <div class="row minor">
        <label class="check"><input id="useAi" type="checkbox" checked /> 无免费 API / 人机验证时用 AI 查询</label>
        <button id="bindBtn" type="button" class="ghost">按此列预览</button>
      </div>
      <p class="hint">当前金山文档个人账号无法直接改在线文件。查询后会写进下载表的状态列，并在本页展示汇总；把 xlsx 导入覆盖即可。</p>
    </section>

    <section id="summary" class="stats hidden"></section>

    <section class="actions hidden" id="actions">
      <button id="runBtn" type="button">刷新未到货</button>
      <a id="downloadBtn" class="btn ghost hidden" href="#">下载更新表</a>
      <p id="progress" class="progress"></p>
    </section>

    <section class="card hidden" id="pendingCard">
      <h2>将处理的订单</h2>
      <div class="table-wrap"><table id="pendingTable"></table></div>
    </section>

    <section class="card hidden" id="resultCard">
      <h2>查询结果</h2>
      <div class="table-wrap"><table id="resultTable"></table></div>
    </section>

    <section class="card hidden" id="logCard">
      <h2>日志</h2>
      <pre id="logs"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
