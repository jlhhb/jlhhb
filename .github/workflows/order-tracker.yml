name: Order Tracker Tests

on:
  pull_request:
    paths:
      - "order-tracker/**"
  push:
    paths:
      - "order-tracker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
